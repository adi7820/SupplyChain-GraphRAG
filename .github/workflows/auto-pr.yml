name: Automated PR Creator

on:
  push:
    branches:
      - '**'
      - '!main'

permissions:
  contents: read
  pull-requests: write

jobs:
  create-pr:
    name: Open Pull Request to Main
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check Existing PR & Create if Needed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          echo "Checking if a Pull Request already exists for branch: $BRANCH_NAME"
          EXISTING_PR=$(gh pr list --head "$BRANCH_NAME" --base main --state open --json number --jq '.[0].number')

          if [ -n "$EXISTING_PR" ] && [ "$EXISTING_PR" != "null" ]; then
            echo "PR #$EXISTING_PR already exists for branch $BRANCH_NAME. Skipping PR creation."
            exit 0
          fi

          # Extract friendly title from branch name
          if [[ "$BRANCH_NAME" =~ / ]]; then
            PR_TYPE=$(echo "$BRANCH_NAME" | cut -d'/' -f1)
            RAW_TITLE=$(echo "$BRANCH_NAME" | cut -d'/' -f2-)
          else
            PR_TYPE=""
            RAW_TITLE="$BRANCH_NAME"
          fi

          CLEAN_TITLE=$(echo "$RAW_TITLE" | tr '-' ' ' | tr '_' ' ' | awk '{for(i=1;i<=NF;i++)sub(/./,toupper(substr($i,1,1)),$i)}1')

          if [ -n "$PR_TYPE" ]; then
            TITLE="[$PR_TYPE] $CLEAN_TITLE"
          else
            TITLE="$CLEAN_TITLE"
          fi

          # Generate commit history body
          COMMITS=$(git log origin/main..HEAD --pretty=format:"- %s (%h)" 2>/dev/null || git log -5 --pretty=format:"- %s (%h)")

          {
            echo "## Automated Pull Request"
            echo ""
            echo "This PR was automatically opened by the **Automated PR Creator** workflow upon pushing to \`$BRANCH_NAME\`."
            echo ""
            echo "### Branch Information"
            echo "- **Source Branch**: \`$BRANCH_NAME\`"
            echo "- **Target Branch**: \`main\`"
            echo "- **Triggered By**: @${{ github.actor }}"
            echo ""
            echo "### Commits Included"
            echo "$COMMITS"
            echo ""
            echo "---"
            echo ""
            echo "### PR Checklist"
            echo "- [ ] Code follows repository style and quality guidelines"
            echo "- [ ] Tests and verifications have been performed"
            echo "- [ ] Documentation updated where relevant"
            echo ""
            echo "*Created automatically by GitHub Actions.*"
          } > pr_body.md

          echo "Opening PR: $TITLE"
          gh pr create \
            --base main \
            --head "$BRANCH_NAME" \
            --title "$TITLE" \
            --body-file pr_body.md
