name: Automated PR Code Reviewer

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    name: Gemini PR Code Review
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade google-generativeai python-dotenv

      - name: Extract Pull Request Diff
        run: |
          git diff origin/${{ github.base_ref }}...HEAD > pr_diff.txt
          echo "Extracted diff size: $(wc -l < pr_diff.txt) lines"

      - name: Generate Code Review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/pr_reviewer.py --diff-file pr_diff.txt --output-file pr_review.md
          echo "=== GENERATED CODE REVIEW ==="
          cat pr_review.md
          echo "=============================="

      - name: Post Review Comment to Pull Request
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const reviewBody = fs.readFileSync('pr_review.md', 'utf8');
            const issue_number = context.issue.number;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // List existing comments on the PR
            const comments = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number
            });

            // Find previous bot comment to update, avoiding duplicate clutter
            const botComment = comments.data.find(c =>
              c.user.login.includes('github-actions') &&
              (c.body.includes('Automated Code Review') || c.body.includes('Gemini AI Code Review'))
            );

            if (botComment) {
              console.log(`Updating existing comment ${botComment.id}...`);
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: botComment.id,
                body: reviewBody
              });
              console.log('Comment updated successfully.');
            } else {
              console.log('Posting new review comment...');
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body: reviewBody
              });
              console.log('New review comment posted successfully.');
            }
